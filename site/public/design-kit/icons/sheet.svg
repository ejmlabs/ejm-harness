<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792" viewBox="0 0 1200 792" role="img" aria-labelledby="ejmlabs-icon-sheet-title ejmlabs-icon-sheet-desc">
  <title id="ejmlabs-icon-sheet-title">ejmlabs interface icons</title>
  <desc id="ejmlabs-icon-sheet-desc">Twelve simple line icons on Paper: arrow right, arrow up right, download, plus, close, check, menu, search, code, play, pause, and external link. Drawn on a 24 by 24 grid with a 1.5 unit stroke and rounded ends and joins.</desc>
  <rect width="1200" height="792" fill="#F6F5EF"/>
  <g font-family="Manrope, Arial, sans-serif">
    <text x="64" y="94" fill="#29443B" font-size="44" font-weight="600">Useful marks.</text>
    <text x="64" y="134" fill="#202721" font-size="20">Twelve quiet tools for links, controls, and small actions.</text>
    <path d="M64 174h1072M64 338h1072M64 502h1072M64 666h1072" fill="none" stroke="#29443B" stroke-width="1" opacity="0.2"/>
    <g fill="none" stroke="#29443B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(64 210) scale(2)"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
      <g transform="translate(344 210) scale(2)"><path d="M6 18 18 6M6 6h12v12"/></g>
      <g transform="translate(624 210) scale(2)"><path d="M12 3.5V15M7.5 10.5 12 15l4.5-4.5M4.5 16.5v3a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-3"/></g>
      <g transform="translate(904 210) scale(2)"><path d="M12 5v14M5 12h14"/></g>
      <g transform="translate(64 374) scale(2)"><path d="m6 6 12 12M18 6 6 18"/></g>
      <g transform="translate(344 374) scale(2)"><path d="m5 12.5 4.5 4.5L19 7"/></g>
      <g transform="translate(624 374) scale(2)"><path d="M4 6h16M4 12h16M4 18h16"/></g>
      <g transform="translate(904 374) scale(2)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></g>
      <g transform="translate(64 538) scale(2)"><path d="M8 6 2.5 12 8 18M16 6l5.5 6-5.5 6M14 4.5l-4 15"/></g>
      <g transform="translate(344 538) scale(2)"><path d="m8 4.5 12 7.5-12 7.5Z"/></g>
      <g transform="translate(624 538) scale(2)"><path d="M8 5v14M16 5v14"/></g>
      <g transform="translate(904 538) scale(2)"><path d="M14 4h6v6M20 4l-9.5 9.5M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></g>
    </g>
    <g fill="#202721" font-size="18" font-weight="600">
      <text x="64" y="298">Arrow right</text><text x="344" y="298">Arrow up right</text><text x="624" y="298">Download</text><text x="904" y="298">Plus</text>
      <text x="64" y="462">Close</text><text x="344" y="462">Check</text><text x="624" y="462">Menu</text><text x="904" y="462">Search</text>
      <text x="64" y="626">Code</text><text x="344" y="626">Play</text><text x="624" y="626">Pause</text><text x="904" y="626">External link</text>
    </g>
    <text x="64" y="718" fill="#29443B" font-size="18">24 px grid · 1.5 px stroke · Round caps and joins · Inherits text color</text>
    <text x="64" y="748" fill="#202721" font-size="16">Shown at 48 px. These interface icons are additions to the kit, separate from the ejmlabs identity.</text>
  </g>
</svg>
