[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ejm-harness"
version = "0.1.1"
description = "Python SDK for ejm-harness's Rust worker"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/ejmlabs/ejm-harness"
Documentation = "https://github.com/ejmlabs/ejm-harness/blob/main/docs/sdk.md"
Issues = "https://github.com/ejmlabs/ejm-harness/issues"

[project.optional-dependencies]
dev = ["mypy==2.4.0", "ruff==0.13.2", "build==1.3.0", "datamodel-code-generator==0.86.0"]

[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.13.2", "build==1.3.0", "datamodel-code-generator==0.86.0"]

[tool.setuptools.packages.find]
include = ["ejm_harness*"]

[tool.setuptools.package-data]
ejm_harness = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["ejm_harness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "PIE", "RET", "RUF", "PTH", "T20"]

