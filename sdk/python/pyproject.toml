[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ejm-harness"
version = "0.1.1"
description = "Python SDK for ejm-harness's Rust worker"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/ejmlabs/ejm-harness"
Documentation = "https://github.com/ejmlabs/ejm-harness/blob/main/docs/sdk.md"
Issues = "https://github.com/ejmlabs/ejm-harness/issues"

[project.optional-dependencies]
dev = ["mypy==2.4.0", "ruff==0.17.0", "build==1.3.0", "datamodel-code-generator==0.86.0", "shellcheck-py==0.11.0.1"]

[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.17.0", "build==1.3.0", "datamodel-code-generator==0.86.0", "shellcheck-py==0.11.0.1"]

[tool.setuptools.packages.find]
include = ["ejm_harness*"]

[tool.setuptools.package-data]
ejm_harness = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["ejm_harness"]
mypy_path = "$MYPY_CONFIG_FILE_DIR"

[tool.ruff]
extend = "../../ruff.strict.toml"
target-version = "py311"
line-length = 100
