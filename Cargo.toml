[workspace]
members = ["crates/ejm-harness-exec", "crates/ejm-harness-auth", "crates/ejm-harness", "crates/ejm-harness-coding", "crates/ejm-harness-worker", "crates/ejm-harness-bench", "crates/ejm-harness-package-spec", "crates/ejm-harness-packages"]
exclude = ["registry"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"
repository = "https://github.com/ejmlabs/ejm-harness"
homepage = "https://github.com/ejmlabs/ejm-harness"
documentation = "https://github.com/ejmlabs/ejm-harness/tree/main/docs"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1.92"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt", "codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rustix = { version = "1.1.5", default-features = false }
procfs-core = { version = "0.18.0", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
wiremock = "0.6.5"
semver = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
walkdir = "2"
base64 = "0.22"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
ejm-harness-package-spec = { path = "crates/ejm-harness-package-spec", version = "0.1.0" }
ejm-harness-packages = { path = "crates/ejm-harness-packages", version = "0.1.0" }
ejm-harness-exec = { path = "crates/ejm-harness-exec", version = "0.1.0" }
ejm-harness = { path = "crates/ejm-harness", version = "0.1.0" }
ejm-harness-auth = { path = "crates/ejm-harness-auth", version = "0.1.0" }
ejm-harness-coding = { path = "crates/ejm-harness-coding", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

