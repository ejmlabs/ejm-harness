[package]
name = "ejm-registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"
repository = "https://github.com/ejmlabs/ejm-harness"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ejm-harness-package-spec = { path = "../crates/ejm-harness-package-spec", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
futures-util = "0.3"
js-sys = "0.3"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
