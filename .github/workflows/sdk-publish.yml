name: Publish SDK packages
# DISABLED until the owner confirms the npm and PyPI package names and sets up
# npm trusted publishing and a PyPI Trusted Publisher for this workflow file.
# To enable: confirm both, then replace `false` in each job condition with a
# check against a repository variable or remove it in a reviewed change.
# These jobs check out no project code and run none. They publish only the files
# that the read-only sdk-build.yml run produced, after re-checking every digest.
on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Run ID of a successful "Build SDK packages" run on protected main
        required: true
        type: string
permissions: {}
jobs:
  npm:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require a successful main build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build-run-id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,workflowName,event \
            --jq 'select(.conclusion == "success" and .headBranch == "main" and .workflowName == "Build SDK packages" and (.event == "push" or .event == "workflow_dispatch"))' \
            | grep -q . || { echo "not a successful main build" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: out
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}
      - name: Check digests
        run: cd out && sha256sum -c SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish with provenance
        run: npm publish --provenance --access public out/npm/ejm-harness-*.tgz
  pypi:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    environment: pypi-publish
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require a successful main build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build-run-id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,workflowName,event \
            --jq 'select(.conclusion == "success" and .headBranch == "main" and .workflowName == "Build SDK packages" and (.event == "push" or .event == "workflow_dispatch"))' \
            | grep -q . || { echo "not a successful main build" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: out
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}
      - name: Check digests
        run: cd out && sha256sum -c SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          packages-dir: out/python
