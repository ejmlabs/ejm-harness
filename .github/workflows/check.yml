name: Required quality gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install pinned Rust quality tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          cargo install --locked --jobs 2 --version 0.20.2 cargo-deny
          cargo install --locked --jobs 2 --version 0.9.2 cargo-machete
      - name: Install SDK development dependencies
        run: |
          npm ci --ignore-scripts
          uv python install 3.11
          uv sync --project sdk/python --group dev --locked
      - name: Run the required local gate
        run: ./scripts/check
