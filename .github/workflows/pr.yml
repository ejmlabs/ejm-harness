name: Human-admitted PR checks
on:
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  governance:
    if: ${{ github.event.issue.pull_request }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@5fae851502c2e3c31d4df9a44f8d56c2cb49e098
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
