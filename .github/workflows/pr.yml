name: Human-admitted PR checks
on:
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  governance:
    if: ${{ github.event.issue.pull_request }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@5b7c9836fa4fa91e197baf584d7c74981660bb12
    secrets:
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
