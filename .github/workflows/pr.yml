name: Human-admitted PR checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled]
permissions: {}
jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@ba109a59c9818c78eb0cfe9fe99f4707c4122ebc
    secrets:
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
