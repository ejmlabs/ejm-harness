name: Human-admitted PR checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled]
permissions: {}
jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@8230ef8234b296ed42024744e8e42bc3d3bb4545
    secrets:
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
