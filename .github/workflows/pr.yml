name: Human-admitted PR checks
on:
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  governance:
    if: ${{ github.event.issue.pull_request }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@5da69be72a4ced67a6be8675bd6c7f669ecac76b
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
