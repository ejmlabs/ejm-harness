name: Draft source release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full protected main commit SHA
        required: true
        type: string
      version:
        description: SemVer version matching VERSION
        required: true
        type: string
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
      statuses: read
    uses: ejmlabs/.github/.github/workflows/draft-release.yml@6717b433c462e01abaed86e2118e4843827598cb
    with:
      commit: ${{ inputs.commit }}
      version: ${{ inputs.version }}
      standards-ref: "6717b433c462e01abaed86e2118e4843827598cb"
