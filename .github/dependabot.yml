version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # The ejmlabs/.github pins in the caller workflows move by hand, together with standards-ref, in one PR.
      # The star also matches reusable workflow paths such as ejmlabs/.github/.github/workflows/governance.yml.
      - dependency-name: "ejmlabs/.github*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "cargo"
    directory: "/registry"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "npm"
    directory: "/registry"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "uv"
    directory: "/sdk/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
