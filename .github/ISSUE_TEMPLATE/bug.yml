name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and result
      description: Include the version or commit, OS, minimal steps, expected result, and actual result. Remove private data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Include small, sanitized logs or screenshots. Report vulnerabilities privately.
